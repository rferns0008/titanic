name: Python CD

on:
  workflow_run:
    workflows:
      - Python CI
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
          # Install DVC with S3 support so CD can pull and push to Backblaze B2
          python -m pip install "dvc[s3]"

      - name: Pull DVC data
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APP_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.B2_REGION }}
        if: ${{ env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "Skipping DVC pull: Backblaze credentials are not configured."
            exit 0
          fi
          dvc pull

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: |
          python -m pytest src/tests

      - name: Train model and generate predictions
        run: |
          python src/train.py --test-csv data/train.csv --predictions-output outputs/test_predictions.csv

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: titanic-artifacts
          path: |
            models/titanic_model.pkl
            outputs/test_predictions.csv
