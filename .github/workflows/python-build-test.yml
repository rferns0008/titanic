name: Python CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest "dvc[s3]"

      - name: Pull DVC data
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APP_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.B2_REGION }}
        if: ${{ env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' }}
        run: dvc pull

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: |
          mkdir -p reports
          python -m pytest src/tests --junitxml=reports/junit.xml

      - name: Train model and generate predictions
        env:
          SKIP_DVC_PULL: 'true'
        run: |
          python src/train.py --train-csv data/train.csv --model-output models/titanic_model.pkl
          python src/test.py --test-csv data/test.csv --model-path models/titanic_model.pkl --predictions-output outputs/test_predictions.csv

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            reports/junit.xml
            models/titanic_model.pkl
            outputs/test_predictions.csv